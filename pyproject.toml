[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pneumonia-vit-statistical-rigour"
version = "1.0.0"
description = "Paired statistical comparison of pneumonia classifiers: McNemar, DeLong, bootstrap, Wilson intervals and Holm correction"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rahul Gupta", email = "0guptr57@solent.ac.uk" }]
keywords = ["pneumonia", "vision-transformer", "statistics", "mcnemar", "delong"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=2.0",
    "scipy>=1.7",
    "scikit-learn>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
pneumonia-stats = "pneumonia_stats.cli:main"

[tool.setuptools]
packages = ["pneumonia_stats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
